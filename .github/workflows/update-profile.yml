name: Update contribution calendar
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-calendar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Render calendar
        run: python scripts/update_contributions.py
      - name: Commit changed artwork
        run: |
          git add assets/contributions.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh contribution calendar'
            git push
          fi
